version: "3.8"

services:
  shinobi-mcp-server:
    build:
      context: .
      dockerfile: apps/shinobi-mcp-server/Dockerfile
    container_name: shinobi-mcp-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SHINOBI_COMPUTE_MODE=ecs
      - SHINOBI_CPU=512
      - SHINOBI_MEMORY=1024
      - SHINOBI_DATA_STORE_TYPE=dynamodb
      - SHINOBI_API_EXPOSURE=internal
      - SHINOBI_COMPLIANCE_FRAMEWORK=commercial
      - SHINOBI_LOG_LEVEL=info
    volumes:
      # Mount platform-kb for live updates during development
      - ./platform-kb:/app/platform-kb:ro
      # Mount components for live catalog updates
      - ./packages/components:/app/packages/components:ro
      # Mount docs for MCP documentation tools
      - ./docs:/app/docs:ro
      # Mount audit files for compliance checks
      - ./.cursor:/app/.cursor:ro
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

