service: hello-world-api
owner: you
complianceFramework: commercial
environment: dev
region: us-west-2
accountId: "911871352725"

components:
  - name: api
    type: lambda-api
    config:
      runtime: nodejs20.x
      handler: index.handler
      memory: 512
      codePath: ./src

  - name: api-role
    type: iam-role
    binds:
      - to: api
        capability: iam:role
        access: read

  # Note: CloudWatch Log Groups are automatically created by lambda-api component
  # No separate cloudwatch-log-group component is needed

  - name: protected-db
    type: rds-postgres
    config:
      instanceClass: db.t3.micro
      allocatedStorage: 20
    binds:
      - to: api
        capability: db:postgres
        access: readwrite

