service: hello-world-api
owner: you
complianceFramework: commercial
environment: dev
region: us-east-1
accountId: "123456789012"  # Replace with your AWS account ID

components:
  - name: api
    type: lambda-api
    config:
      runtime: nodejs20.x
      handler: index.handler
      memory: 512
      codePath: ./src

  - name: api-role
    type: iam-role
    binds:
      - to: api
        capability: iam:role
        access: read

  - name: logs-group
    type: cloudwatch-log-group
    binds:
      - to: api
        capability: monitoring:logs
        access: write

  - name: protected-db
    type: rds-postgres
    config:
      instanceClass: db.t3.micro
      allocatedStorage: 20
    binds:
      - to: api
        capability: db:postgres
        access: readwrite

