# Basic Network Rules Stack Usage Example
#
# This example shows the minimal configuration required to use the
# Network Rules Stack component. It will use default values for all
# optional fields.

service: platform-network-rules
owner: Platform Engineering
complianceFramework: commercial
environment: production
region: us-east-1

components:
  - name: cross-stack-rules
    type: network-rules-stack
    config:
      description: "Cross-stack security group rules from all services"


