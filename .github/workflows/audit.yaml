name: platform-audit
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for diff checks
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is automatically read from package.json "packageManager" field
      
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'pnpm'  # Enables caching of the pnpm store for faster installs
      
      - name: Verify environment
        run: |
          echo "Node.js version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
          echo "Working directory: $(pwd)"
          echo "Git branch: $(git rev-parse --abbrev-ref HEAD || echo 'N/A')"
      
      - name: Install ripgrep
        run: |
          set -x  # Enable verbose shell output
          sudo apt-get update && sudo apt-get install -y ripgrep
      
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile --loglevel=verbose
      
      - name: Run platform audit (strict mode)
        run: pnpm run audit:platform:strict --loglevel=verbose
