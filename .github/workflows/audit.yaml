name: platform-audit
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for diff checks
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is automatically read from package.json "packageManager" field
      
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'pnpm'  # Enables caching of the pnpm store for faster installs
      
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      
      - name: Run governance audit
        run: pnpm run audit:gov
      
      - name: Run testing audit
        run: pnpm run audit:test
      
      - name: Run observability audit
        run: pnpm run audit:otel
      
      - name: Run comprehensive audit
        run: pnpm run audit:all -- --base origin/main --format pretty
      
      - name: Run strict audit (warnings as errors)
        run: pnpm run audit:all:strict -- --base origin/main --format pretty
        continue-on-error: true
