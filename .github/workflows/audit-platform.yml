name: Platform Governance Audit

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  audit:
    name: Platform Governance Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff checks
          
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is automatically read from package.json "packageManager" field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'  # Enables caching of the pnpm store for faster installs

      - name: Verify environment
        run: |
          echo "Node.js version: $(node --version)"
          echo "pnpm version: $(pnpm --version)"
          echo "Working directory: $(pwd)"
          echo "Git branch: $(git rev-parse --abbrev-ref HEAD || echo 'N/A')"

      - name: Install system dependencies
        run: |
          set -x  # Enable verbose shell output
          echo "Installing ripgrep (required for platform audit CLI)..."
          sudo apt-get update
          sudo apt-get install -y ripgrep
          echo "Verifying ripgrep installation..."
          rg --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --loglevel=verbose

      - name: Check system dependencies
        run: pnpm run check:deps --loglevel=verbose

      - name: Run platform audit
        run: pnpm run audit:platform:strict --loglevel=verbose
        
      - name: Upload audit results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            .cursor/audit/
            scripts/audit-platform.mjs
          retention-days: 30
